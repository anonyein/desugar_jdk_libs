name: Build and Package desugar_jdk_libs_nio

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 固定 Bazel 版本（6.5.0 避免 Python 规则缺失）
      - name: Pin Bazel version
        run: echo "6.5.0" > .bazelversion

      # 发现目标（可选，但保留动态查找以防命名变化）
      - name: Discover build target
        id: find_target
        run: |
          TARGET=$(bazel query 'kind("genrule", //...)' 2>/dev/null | grep -i nio | head -n1)
          if [ -z "$TARGET" ]; then
            TARGET=$(bazel query '//:maven_release*' 2>/dev/null | head -n1)
          fi
          if [ -z "$TARGET" ]; then
            echo "No suitable target found. Available targets:"
            bazel query //...
            exit 1
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Found target: $TARGET"

      - name: Build NIO package
        run: bazel build ${{ steps.find_target.outputs.target }}

      # 直接使用确切的输出文件名上传
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desugar_jdk_libs_nio
          path: bazel-bin/desugar_jdk_libs_jdk11_nio.zip
          if-no-files-found: error
