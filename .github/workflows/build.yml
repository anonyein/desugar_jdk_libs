name: Build and Package desugar_jdk_libs_nio

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # 支持手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 环境 (Bazel 构建 Java 项目需要)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3. 安装 Bazel
      - name: Install Bazel
        uses: bazelbuild/setup-bazelisk@v3
        with:
          # 如果需要固定版本，可以取消注释并指定版本号
          # bazelisk-version: 'latest'
          bazelisk-version: 'latest'

      # 4. 使用 Bazel 构建 desugar_jdk_libs_nio 包
      #    目标名称来源于根目录 BUILD 文件中的 genrule
      - name: Build desugar_jdk_libs_nio
        run: bazel build //:maven_release_jdk11_nio

      # 5. 上传构建产物 (zip 包)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desugar_jdk_libs_nio_package
          # Bazel 构建输出默认在 bazel-bin/ 目录下
          # 根据 BUILD 文件定义，输出文件名为 desugar_jdk_libs_jdk11_nio.zip[reference:2]
          path: bazel-bin/desugar_jdk_libs_jdk11_nio.zip
