name: Build All Desugar JDK Libs Packages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 固定 Bazel 版本（6.5.0 可避免 Python 规则缺失问题）
      - name: Pin Bazel version
        run: echo "6.5.0" > .bazelversion

      # 修改所有 VERSION_JDK11*.txt 文件
      - name: Update version to 2.1.6-SNAPSHOT
        run: |
          # 查找所有 VERSION_JDK11*.txt 文件并替换版本号
          for file in VERSION_JDK11*.txt; do
            if [ -f "$file" ]; then
              echo "Updating $file from 2.1.5 to 2.1.6-SNAPSHOT"
              sed -i 's/2.1.5/2.1.6-SNAPSHOT/g' "$file"
            fi
          done
          
          # 验证是否修改成功
          echo "Current versions:"
          cat VERSION_JDK11*.txt

      # 构建所有 maven_release 目标
      - name: Build all Maven release targets
        run: |
          bazel build //:maven_release_jdk11
          bazel build //:maven_release_jdk11_legacy
          bazel build //:maven_release_jdk11_minimal
          bazel build //:maven_release_jdk11_nio

      # 上传所有生成的 zip 包
      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desugar_jdk_libs_packages
          path: bazel-bin/*.zip
          if-no-files-found: error
